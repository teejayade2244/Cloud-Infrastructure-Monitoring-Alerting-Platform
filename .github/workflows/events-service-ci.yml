name: events-service CI

on:
  push:
    branches: ['**']
    paths: ['Microservices/services/events-service/**']
  pull_request:
    branches: [main]
    paths: ['Microservices/services/events-service/**']
  # Doesn't affect push/pull_request path-filtering at all - purely additive, for the case a
  # change touches only this workflow file and so wouldn't match either paths: filter above.
  workflow_dispatch: {}

# A job inside a called workflow_call template can only request permissions up to what THIS
# calling workflow grants at its own top level - confirmed the hard way, via a real
# startup_failure ("nested job 'sast' is requesting 'security-events: write', but is only allowed
# 'security-events: none'"). This is the union of every distinct scope any job in
# service-ci-template.yml requests; each job's own, narrower permissions: block still applies on
# top of this ceiling, so this doesn't loosen any individual job beyond what it already asks for.
permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  call-service-ci:
    uses: ./.github/workflows/service-ci-template.yml
    with:
      service_name: events-service
      has_gitops_deploy: true
      chart_path: charts/events-service
      image_repository: inframonitoraksacr.azurecr.io/events-service
      build_container_image: node:20
      install_command: npm ci
      lint_command: npm run lint && npm run format:check
      test_command: npm run test:coverage
      coverage_report_path: Microservices/services/events-service/coverage/
      codeql_language: javascript
      codeql_paths_ignore: '["Microservices/services/events-service/node_modules", "Microservices/services/events-service/coverage"]'
      has_integration_tests: true
      integration_test_command: npm run test:integration
      integration_test_vars: |
        {
          "COSMOS_ENDPOINT": "${{ vars.COSMOS_ENDPOINT }}",
          "COSMOS_TEST_DATABASE": "${{ vars.COSMOS_TEST_DATABASE }}",
          "SERVICEBUS_NAMESPACE": "${{ vars.SERVICEBUS_NAMESPACE }}",
          "SERVICEBUS_TEST_TOPIC": "${{ vars.SERVICEBUS_TEST_TOPIC }}",
          "SERVICEBUS_TEST_SUBSCRIPTION": "${{ vars.SERVICEBUS_TEST_SUBSCRIPTION }}"
        }
      has_smoke_test: true
    secrets:
      azure_client_id_ci: ${{ secrets.AZURE_CLIENT_ID_EVENTS_CI }}
      azure_client_id_cd: ${{ secrets.AZURE_CLIENT_ID_EVENTS_CD }}
      azure_client_id_smoke: ${{ secrets.AZURE_CLIENT_ID_EVENTS_SMOKE }}
      gitops_pat: ${{ secrets.GITOPS_PAT }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
