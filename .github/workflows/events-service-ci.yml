name: events-service CI

on:
  push:
    branches: ['**']
    paths: ['Microservices/services/events-service/**']
  pull_request:
    branches: [main]
    paths: ['Microservices/services/events-service/**']
  # Doesn't affect push/pull_request path-filtering at all - purely additive, for the case a
  # change touches only this workflow file and so wouldn't match either paths: filter above.
  workflow_dispatch: {}

# Restrictive default; the sast job overrides this to add security-events: write, which the
# CodeQL analyze step needs regardless of the repo's default token permissions.
permissions:
  contents: read

env:
  WORKING_DIR: Microservices/services/events-service

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - run: npm ci

      - run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage/
          retention-days: 14

  dependency-scan:
    name: Dependency Scan (package-lock.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Filesystem-mode scan of package-lock.json directly, before any build happens - distinct
      # from container-scan, which checks the built image (OS packages + app deps together)
      # after a full Docker build. This one is fast, needs no npm ci/build, and catches
      # known-vulnerable third-party dependencies as early and cheaply as possible.
      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.WORKING_DIR }}
          format: table
          output: ${{ env.WORKING_DIR }}/trivy-fs-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-scan-results
          path: ${{ env.WORKING_DIR }}/trivy-fs-results.txt
          retention-days: 14

  sast:
    name: CodeQL (SAST)
    needs: [lint-and-format, unit-tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # Scoped to events-service only - without this, CodeQL's default behavior scans every
      # JS file in the whole monorepo (Frontend/, other Microservices/, etc.), which doesn't
      # match this workflow's stated scope and would be slow and noisy for no benefit.
      - uses: github/codeql-action/init@v3.37.7
        with:
          languages: javascript
          config: |
            paths:
              - ${{ env.WORKING_DIR }}
            paths-ignore:
              - ${{ env.WORKING_DIR }}/node_modules
              - ${{ env.WORKING_DIR }}/coverage

      - uses: github/codeql-action/autobuild@v3.37.7

      - uses: github/codeql-action/analyze@v3.37.7

  build:
    name: Docker Build
    needs: [lint-and-format, unit-tests]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image (validation only, not pushed anywhere)
        run: docker build --platform linux/amd64 -t events-service:${{ steps.vars.outputs.image_tag }} .

      - name: Save image for the container-scan job
        run: docker save events-service:${{ steps.vars.outputs.image_tag }} -o events-service-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.WORKING_DIR }}/events-service-image.tar
          retention-days: 3

  integration-tests:
    name: Integration Tests (real Cosmos DB + Service Bus)
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - run: npm ci

      # events-service-ci-identity - a dedicated CI-only identity, federated to this repo (main
      # + pull_request) via OIDC, with RBAC scoped only to the test database/topic below - never
      # the app's own production identity or production data.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_EVENTS_CI }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Piped through tee rather than run directly, so the output is both visible live in the
      # Actions log and captured to a file for the artifact upload below - GitHub Actions' bash
      # steps run with pipefail by default, so the step still fails correctly if the tests do.
      - run: npm run test:integration 2>&1 | tee test-results.txt
        env:
          COSMOS_ENDPOINT: ${{ vars.COSMOS_ENDPOINT }}
          COSMOS_TEST_DATABASE: ${{ vars.COSMOS_TEST_DATABASE }}
          SERVICEBUS_NAMESPACE: ${{ vars.SERVICEBUS_NAMESPACE }}
          SERVICEBUS_TEST_TOPIC: ${{ vars.SERVICEBUS_TEST_TOPIC }}
          SERVICEBUS_TEST_SUBSCRIPTION: ${{ vars.SERVICEBUS_TEST_SUBSCRIPTION }}
          # The CI-only identity above, not the app's own managed identity - DefaultAzureCredential
          # picks this up via the same pattern azureConfig.js already uses.
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_EVENTS_CI }}

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ env.WORKING_DIR }}/test-results.txt
          retention-days: 14

  container-scan:
    name: Container Vulnerability Scan
    needs: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      # Loading the exact image artifact the build job produced, rather than rebuilding, so
      # what's scanned is guaranteed to be byte-for-byte what build actually produced - not a
      # separately-built image that merely should be identical.
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ env.WORKING_DIR }}

      - run: docker load -i events-service-image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: events-service:${{ needs.build.outputs.image_tag }}
          format: table
          output: ${{ env.WORKING_DIR }}/trivy-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: ${{ env.WORKING_DIR }}/trivy-results.txt
          retention-days: 14

      # SBOM reflects the FINAL, BUILT image - base OS packages plus the fully resolved
      # dependency tree as actually shipped - not just package-lock.json, which is why this
      # runs against image-ref here rather than in dependency-scan's filesystem-mode scan.
      # A CycloneDX SBOM is a component inventory, not a vulnerability report, so
      # severity/ignore-unfixed/exit-code don't apply and are deliberately omitted - this step
      # always succeeds and never gates the pipeline, purely archival.
      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: events-service:${{ needs.build.outputs.image_tag }}
          format: cyclonedx
          output: ${{ env.WORKING_DIR }}/sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ${{ env.WORKING_DIR }}/sbom.cyclonedx.json
          retention-days: 90
