name: events-service production promotion
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Short SHA image tag to promote (must already be built, scanned, and smoke-tested in
          staging)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-staging-smoke-test:
    name: Verify staging smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify image tag has a successful staging smoke test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: scripts/verify-staging-smoke-test.sh

  promote-to-production:
    name: Promote to production (inframonitor-gitops)
    needs: verify-staging-smoke-test
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teejayade2244/inframonitor-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Install yq
        run: |
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set production image tag
        run: yq -i '.image.tag = "${{ inputs.image_tag }}"' charts/events-service/values-production.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/events-service/values-production.yaml
          git commit -m "deploy(production): promote events-service to ${{ inputs.image_tag }}

          PRODUCTION PROMOTION
          Image tag: ${{ inputs.image_tag }}
          Triggered by: @${{ github.actor }}
          Verified via: Smoke Test (staging), events-service-ci.yml"
          git push

  smoke-test-production:
    name: Smoke Test (production)
    needs: promote-to-production
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Forwards promote-to-production's tag so rollback-production can read it without needing
    # that job directly in its own needs: list (rollback-production's needs is exactly
    # smoke-test-production, since that's the job whose result gates it) - same pattern used for
    # smoke-test-staging/rollback-staging in events-service-ci.yml.
    outputs:
      image_tag: ${{ needs.promote-to-production.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_EVENTS_SMOKE }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl + kubelogin
        run: sudo az aks install-cli

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group inframonitor-aks-rg --name inframonitor-aks --overwrite-existing

      - name: Convert kubeconfig for azurecli auth
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Run production smoke test
        id: smoke_test
        env:
          EXPECTED_TAG: ${{ needs.promote-to-production.outputs.image_tag }}
          NAMESPACE: inframonitor-production
          ARGOCD_APP_NAME: events-service-production
          ENVIRONMENT_LABEL: production
        run: scripts/smoke-test.sh

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-evidence-production
          path: smoke-test-evidence/
          retention-days: 14

  rollback-production:
    name: Rollback production (automatic)
    needs: smoke-test-production
    # failure() is required here, not just the needs.*.result check alone: GitHub Actions
    # silently ANDs an implicit success() onto any job's if: condition unless it already contains
    # one of the status-check functions - confirmed the hard way, via a real deliberate-failure
    # test on the staging equivalent of this job, where it stayed 'skipped' despite its
    # dependency genuinely failing, because success() (false) was silently gating the expression.
    if: failure() && needs.smoke-test-production.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Find rollback target
        id: find_target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: events-service-production-promotion.yml
          SMOKE_TEST_JOB_NAME: "Smoke Test (production)"
          # Production runs are workflow_dispatch-triggered - there's no head_sha-to-tag
          # correspondence the way staging has (confirmed empirically: GitHub's Actions API
          # exposes no input-value field at all for a completed run). The
          # smoke-test-evidence-production artifact that Smoke Test (production) already
          # uploads is the only reliable record of which tag a given run actually tested, so the
          # rollback target is read from there instead.
          TAG_SOURCE: artifact
          ARTIFACT_NAME: smoke-test-evidence-production
          LOOKBACK_LIMIT: "10"
        run: scripts/find-rollback-target.sh

      - name: Checkout inframonitor-gitops
        uses: actions/checkout@v4
        with:
          repository: teejayade2244/inframonitor-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: inframonitor-gitops

      - name: Install yq
        run: |
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set production image tag to rollback target
        working-directory: inframonitor-gitops
        run: yq -i '.image.tag = "${{ steps.find_target.outputs.rollback_tag }}"' charts/events-service/values-production.yaml

      - name: Commit and push rollback
        working-directory: inframonitor-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/events-service/values-production.yaml
          git commit -m "rollback(production): automatic rollback to ${{ steps.find_target.outputs.rollback_tag }}

          AUTOMATIC ROLLBACK - triggered by a failed production smoke test
          Rolled back FROM: ${{ needs.smoke-test-production.outputs.image_tag }}
          Rolled back TO (last verified-good in production): ${{ steps.find_target.outputs.rollback_tag }}
          Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push


      - name: Report rollback
        run: |
          {
            echo "## Automatic production rollback"
            echo ""
            echo "Smoke test failed for tag \`${{ needs.smoke-test-production.outputs.image_tag }}\`."
            echo ""
            echo "Rolled production back to tag \`${{ steps.find_target.outputs.rollback_tag }}\` - the most recent tag with a genuinely verified production smoke test (from run [${{ steps.find_target.outputs.rollback_run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find_target.outputs.rollback_run_id }})). Pushed to inframonitor-gitops."
            echo ""
            echo "ArgoCD will sync this automatically, same as any other change - no manual action needed."
          } >> "$GITHUB_STEP_SUMMARY"
