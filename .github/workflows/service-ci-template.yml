name: service CI template

# Reusable CI pipeline. Per the comparison in docs/reusable-workflow-analysis.md: 6 of 10 jobs
# are clean Category A (parameter-only) and never touch source code at all - dependency-scan,
# build-image, container-scan, update-staging-values, smoke-test-staging, rollback-staging. The
# other four (lint-and-format, unit-tests, sast, integration-tests) are where a caller's own
# toolchain shows up - deliberately made fully language-agnostic via a caller-supplied
# build_container_image plus caller-supplied commands (lint_command/test_command/etc.), not a
# fixed node/dotnet branch pair - so any team can adopt this regardless of language and fine-tune
# it to their own application, without ever editing this shared file.
#
# build_container_image, not a dynamic setup action, is deliberate: a step's `uses:` cannot
# reference the inputs context at all ("context 'inputs' is not allowed here" - confirmed via
# actionlint, a real GitHub Actions constraint, not a style choice) - there is no way to pick
# actions/setup-node@v4 vs actions/setup-dotnet@v4 by an expression. Running the job inside
# whatever container image already has the caller's toolchain installed sidesteps that
# limitation entirely, and is the standard pattern for language-agnostic reusable workflows.
#
# smoke-test-staging is the one deliberate exception to "fully generic": it stays AKS/ArgoCD-
# specific by design (see has_smoke_test below) - that specificity is the actual value of the
# job, not incidental scaffolding to generalize away.
#
# workflow_call templates cannot declare their own push/pull_request paths: trigger - that stays
# in each service's thin caller file (events-service-ci.yml / incidents-service-ci.yml).

on:
  workflow_call:
    inputs:
      service_name:
        description: "e.g. events-service - also derives WORKING_DIR, image tag, chart file names, WORKFLOW_FILE"
        required: true
        type: string
      chart_path:
        description: "Chart directory in inframonitor-gitops, e.g. charts/events-service (values-staging.yaml is appended)"
        required: true
        type: string
      image_repository:
        description: "Full ACR repository path, e.g. inframonitoraksacr.azurecr.io/events-service"
        required: true
        type: string
      build_container_image:
        description: >-
          The container image lint-and-format, unit-tests, sast, and integration-tests all run
          inside - whatever already has this app's toolchain installed, e.g. node:20,
          mcr.microsoft.com/dotnet/sdk:10.0, golang:1.23. This template never hardcodes a
          language; GitHub Actions injects Node.js into any container automatically, so
          JS-based actions used inside these jobs (checkout, azure/login, upload-artifact, the
          CodeQL actions) work regardless of the image's own base.
        required: true
        type: string
      install_command:
        description: "e.g. npm ci, or empty for a language with no separate install step (dotnet restore runs implicitly). Runs once, in the service's own working directory, before lint_command/test_command."
        required: false
        type: string
        default: ''
      lint_command:
        description: "e.g. 'npm run lint && npm run format:check', or 'dotnet format --verify-no-changes'. Runs in the service's own working directory."
        required: true
        type: string
      test_command:
        description: "e.g. npm run test:coverage, or a dotnet test invocation with coverage flags."
        required: true
        type: string
      unit_test_working_directory:
        description: "Override if the test project is a sibling directory rather than the service's own (e.g. incidents-service.Tests). Defaults to the service's own working directory."
        required: false
        type: string
        default: ''
      coverage_report_path:
        description: "Path (relative to repo root) to upload as the coverage-report artifact - a file or a directory, whatever the caller's own tooling produces."
        required: true
        type: string
      codeql_language:
        description: "CodeQL's own language identifier, e.g. javascript, csharp, go, python."
        required: true
        type: string
      codeql_paths_ignore:
        description: >-
          JSON array of FULL paths (already prefixed with the service's own working directory) to
          exclude from CodeQL, e.g. '["Microservices/services/events-service/node_modules"]'.
          JSON array syntax is valid YAML flow-sequence syntax, so this is spliced directly into
          CodeQL's own config: block - no fromJSON() needed.
        required: false
        type: string
        default: '[]'
      has_integration_tests:
        description: "Whether real integration-test code exists for this service yet."
        required: true
        type: boolean
      integration_test_command:
        description: "e.g. npm run test:integration, or dotnet test. Only used when has_integration_tests is true."
        required: false
        type: string
        default: ''
      integration_test_working_directory:
        description: "Override if integration tests live in a separate project/directory from unit tests (e.g. incidents-service.IntegrationTests, a sibling of incidents-service.Tests, not the same directory). Defaults to the service's own working directory."
        required: false
        type: string
        default: ''
      integration_test_vars:
        description: >-
          JSON object of non-secret env vars for the integration-tests job, e.g.
          '{"COSMOS_ENDPOINT": "...", "COSMOS_TEST_DATABASE": "..."}'. Deliberately opaque to this
          template - a caller whose app doesn't use Cosmos DB/Service Bus at all just supplies a
          different map (or omits this and gets an empty one). AZURE_CLIENT_ID is NOT part of
          this blob - it's a real secret and stays its own named, explicit secrets: input below.
        required: false
        type: string
        default: '{}'
      has_smoke_test:
        description: >-
          Whether to run smoke-test-staging (and its rollback-staging safety net) after deploy.
          Unlike the inputs above, this is deliberately NOT an escape hatch to a different
          verification mechanism - smoke-test-staging is AKS/ArgoCD-specific by design (that
          specificity is the actual value of the job, not incidental scaffolding around it). A
          caller not on this cluster should skip it entirely (false) and bring its own deploy +
          verify job, rather than expect this one to become generic.
        required: false
        type: boolean
        default: true
    secrets:
      azure_client_id_ci:
        required: true
      azure_client_id_cd:
        required: true
      azure_client_id_smoke:
        required: true
      gitops_pat:
        required: true
      azure_tenant_id:
        required: true
      azure_subscription_id:
        required: true

# Restrictive default; sast overrides to add security-events: write, same as both original files.
permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    defaults:
      run:
        working-directory: Microservices/services/${{ inputs.service_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Lint
        run: ${{ inputs.lint_command }}

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        working-directory: Microservices/services/${{ inputs.service_name }}
        run: ${{ inputs.install_command }}

      # No job-level defaults.run.working-directory - unit_test_working_directory may be a
      # sibling of the service's own directory (confirmed against incidents-service.Tests's real
      # layout), not nested inside it, so every step that needs a directory is explicit instead.
      - name: Run tests
        working-directory: ${{ inputs.unit_test_working_directory != '' && inputs.unit_test_working_directory || format('Microservices/services/{0}', inputs.service_name) }}
        run: ${{ inputs.test_command }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.coverage_report_path }}
          retention-days: 14

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Filesystem-mode scan of the service's own directory, before any build happens - distinct
      # from container-scan, which checks the built image (OS packages + app deps together)
      # after a full Docker build. Trivy auto-detects whatever lockfile format it finds
      # (package-lock.json, packages.lock.json, go.sum, etc.) - no language input needed here.
      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: Microservices/services/${{ inputs.service_name }}
          format: table
          output: Microservices/services/${{ inputs.service_name }}/trivy-fs-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-scan-results
          path: Microservices/services/${{ inputs.service_name }}/trivy-fs-results.txt
          retention-days: 14

  sast:
    name: CodeQL (SAST)
    needs: [lint-and-format, unit-tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Same build_container_image as lint-and-format/unit-tests, unconditionally - CodeQL's own
    # actions are JS-based and GitHub Actions injects Node.js into any container to run them, so
    # this doesn't need a language-specific toggle the way a bare-runner setup step once did (a
    # compiled language's autobuild needing its SDK present is exactly what the image already
    # provides; an interpreted language's autobuild is a no-op regardless of the image).
    container: ${{ inputs.build_container_image }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.37.7
        with:
          languages: ${{ inputs.codeql_language }}
          config: |
            paths:
              - Microservices/services/${{ inputs.service_name }}
            paths-ignore: ${{ inputs.codeql_paths_ignore }}

      - uses: github/codeql-action/autobuild@v3.37.7

      - uses: github/codeql-action/analyze@v3.37.7

  build-image:
    name: Docker Build
    needs: [lint-and-format, unit-tests]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    defaults:
      run:
        working-directory: Microservices/services/${{ inputs.service_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --platform linux/amd64 -t ${{ inputs.image_repository }}:${{ steps.vars.outputs.image_tag }} .

      - name: Save image
        run: docker save ${{ inputs.image_repository }}:${{ steps.vars.outputs.image_tag }} -o ${{ inputs.service_name }}-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: Microservices/services/${{ inputs.service_name }}/${{ inputs.service_name }}-image.tar
          retention-days: 3

  # Always defined (workflow_call templates have a static job graph - a caller can't make a job
  # disappear), gated by has_integration_tests so it genuinely skips, not silently no-ops, for a
  # service without integration test code yet.
  integration-tests:
    name: Integration Tests
    needs: [lint-and-format, unit-tests]
    if: inputs.has_integration_tests && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        working-directory: Microservices/services/${{ inputs.service_name }}
        run: ${{ inputs.install_command }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id_ci }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      # A step's env: is either a plain mapping or a single expression - there's no way to merge
      # a literal key (AZURE_CLIENT_ID) with the fromJSON-expanded blob below in one env: block,
      # since GitHub Actions expressions have no object-spread operator. Exporting it to
      # $GITHUB_ENV here instead makes it part of the job's own environment for every subsequent
      # step - AZURE_CLIENT_ID is a real secret so it stays its own named, explicit secrets:
      # input (documented, required) rather than folded into the opaque integration_test_vars blob.
      - name: Export AZURE_CLIENT_ID
        run: echo "AZURE_CLIENT_ID=${{ secrets.azure_client_id_ci }}" >> "$GITHUB_ENV"

      # integration_test_vars is an opaque JSON blob (see the input description) - this template
      # never needs to know what a caller's integration tests actually depend on. A caller whose
      # app doesn't use Cosmos DB/Service Bus at all just supplies a different map (incidents-service's
      # only needs COSMOS_ENDPOINT/COSMOS_TEST_DATABASE - it has no Service Bus dependency at all).
      - name: Run integration tests
        working-directory: ${{ inputs.integration_test_working_directory != '' && inputs.integration_test_working_directory || format('Microservices/services/{0}', inputs.service_name) }}
        run: ${{ inputs.integration_test_command }} 2>&1 | tee test-results.txt
        env: ${{ fromJSON(inputs.integration_test_vars) }}

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ inputs.integration_test_working_directory != '' && inputs.integration_test_working_directory || format('Microservices/services/{0}', inputs.service_name) }}/test-results.txt
          retention-days: 14

  container-scan:
    name: Container Vulnerability Scan
    needs: build-image
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.build-image.outputs.image_tag }}
    defaults:
      run:
        working-directory: Microservices/services/${{ inputs.service_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: Microservices/services/${{ inputs.service_name }}

      - run: docker load -i ${{ inputs.service_name }}-image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.image_repository }}:${{ needs.build-image.outputs.image_tag }}
          format: table
          output: Microservices/services/${{ inputs.service_name }}/trivy-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: Microservices/services/${{ inputs.service_name }}/trivy-results.txt
          retention-days: 14

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_repository }}:${{ needs.build-image.outputs.image_tag }}
          format: cyclonedx
          output: Microservices/services/${{ inputs.service_name }}/sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: Microservices/services/${{ inputs.service_name }}/sbom.cyclonedx.json
          retention-days: 90

  push-image:
    name: Push Image to ACR (staging)
    needs: [container-scan, integration-tests]
    # integration-tests is ALWAYS a needs: dependency (workflow_call's static job graph means it
    # always exists), but for a caller with has_integration_tests: false it's skipped, not
    # failed/succeeded - so this condition explicitly accepts 'skipped' alongside 'success' for
    # that one dependency, while still hard-requiring container-scan to have genuinely succeeded.
    # Without the leading always(), the implicit success() GitHub ANDs onto a condition lacking a
    # status-check function would make this job skip whenever integration-tests skips, which is
    # exactly the wrong behavior for a service that doesn't have integration tests yet.
    if: |
      always() &&
      needs.container-scan.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.container-scan.outputs.image_tag }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: Microservices/services/${{ inputs.service_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: Microservices/services/${{ inputs.service_name }}

      - run: docker load -i ${{ inputs.service_name }}-image.tar

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id_cd }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: Login to ACR
        run: az acr login --name inframonitoraksacr

      - name: Push image
        run: docker push ${{ inputs.image_repository }}:${{ needs.container-scan.outputs.image_tag }}

  update-staging-values:
    name: Update staging image tag (inframonitor-gitops)
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.push-image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teejayade2244/inframonitor-gitops
          token: ${{ secrets.gitops_pat }}

      - name: Install yq
        run: |
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set staging image tag
        run: yq -i '.image.tag = "${{ needs.push-image.outputs.image_tag }}"' ${{ inputs.chart_path }}/values-staging.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.chart_path }}/values-staging.yaml
          git commit -m "deploy(staging): ${{ inputs.service_name }} to ${{ needs.push-image.outputs.image_tag }}

          Source: teejayade2244/Cloud-Infrastructure-Monitoring-Alerting-Platform@${{ github.sha }}"
          git push

  smoke-test-staging:
    name: Smoke Test (staging)
    needs: update-staging-values
    if: inputs.has_smoke_test && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ needs.update-staging-values.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id_smoke }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: Install kubectl + kubelogin
        run: sudo az aks install-cli

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group inframonitor-aks-rg --name inframonitor-aks --overwrite-existing

      - name: Convert kubeconfig for azurecli auth
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Run staging smoke test
        id: smoke_test
        env:
          EXPECTED_TAG: ${{ needs.update-staging-values.outputs.image_tag }}
          NAMESPACE: inframonitor
          ARGOCD_APP_NAME: ${{ inputs.service_name }}-staging
          # Always explicit (unlike the pre-template events-service-ci.yml, which relied on
          # smoke-test.sh's own default) - a shared template shouldn't depend on one caller's
          # value happening to match the script's default.
          SERVICE_NAME: ${{ inputs.service_name }}
        run: scripts/smoke-test.sh

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-evidence-staging
          path: smoke-test-evidence/
          retention-days: 14

  rollback-staging:
    name: Rollback staging (automatic)
    needs: smoke-test-staging
    # failure() is required here, not just the needs.*.result check alone: GitHub Actions
    # silently ANDs an implicit success() onto any job's if: condition unless it already contains
    # one of the status-check functions - a real, previously-fixed bug in this project. Applied
    # correctly from the start in this template, not something to rediscover during the refactor.
    # (Also correctly handles has_smoke_test: false for free - a SKIPPED smoke-test-staging has
    # result 'skipped', not 'failure', so this condition stays false and rollback stays skipped
    # too, no extra logic needed.)
    if: failure() && needs.smoke-test-staging.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Find rollback target
        id: find_target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # <service_name>-ci.yml is this template's calling workflow's own filename by
          # convention (both existing caller files follow it) - derived, not a separate input.
          WORKFLOW_FILE: ${{ inputs.service_name }}-ci.yml
          SMOKE_TEST_JOB_NAME: "Smoke Test (staging)"
          TAG_SOURCE: head_sha
          LOOKBACK_LIMIT: "10"
        run: scripts/find-rollback-target.sh

      - name: Checkout inframonitor-gitops
        uses: actions/checkout@v4
        with:
          repository: teejayade2244/inframonitor-gitops
          token: ${{ secrets.gitops_pat }}
          path: inframonitor-gitops

      - name: Install yq
        run: |
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set staging image tag to rollback target
        working-directory: inframonitor-gitops
        run: yq -i '.image.tag = "${{ steps.find_target.outputs.rollback_tag }}"' ${{ inputs.chart_path }}/values-staging.yaml

      - name: Commit and push rollback
        working-directory: inframonitor-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.chart_path }}/values-staging.yaml
          git commit -m "rollback(staging): automatic rollback to ${{ steps.find_target.outputs.rollback_tag }}

          AUTOMATIC ROLLBACK - triggered by a failed staging smoke test
          Rolled back FROM: ${{ needs.smoke-test-staging.outputs.image_tag }}
          Rolled back TO (last verified-good): ${{ steps.find_target.outputs.rollback_tag }}
          Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push

      - name: Report rollback
        run: |
          {
            echo "## Automatic staging rollback"
            echo ""
            echo "Smoke test failed for tag \`${{ needs.smoke-test-staging.outputs.image_tag }}\`."
            echo ""
            echo "Rolled staging back to tag \`${{ steps.find_target.outputs.rollback_tag }}\` - the most recent tag with a genuinely verified staging smoke test (from run [${{ steps.find_target.outputs.rollback_run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find_target.outputs.rollback_run_id }})). Pushed to inframonitor-gitops."
            echo ""
            echo "ArgoCD will sync this automatically, same as any other change - no manual action needed."
          } >> "$GITHUB_STEP_SUMMARY"
