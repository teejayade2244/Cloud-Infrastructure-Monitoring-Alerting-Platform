name: service CI template

on:
  workflow_call:
    inputs:
      service_name:
        description: "A short identifier for this service, e.g. my-service. Used for artifact filenames and naming conventions elsewhere in the pipeline - not used to derive a source path (see working_directory)."
        required: true
        type: string
      working_directory:
        description: >-
          Full path to this service's own source directory, e.g. services/my-service or
          apps/my-service, or "." for a single-service repository. This template makes no
          assumption about repository layout - whatever path you supply is used as-is.
        required: true
        type: string
      dockerfile_path:
        description: "Full path to this service's own Dockerfile, e.g. services/my-service/Dockerfile."
        required: true
        type: string
      build_container_image:
        description: >-
          The container image lint-and-format, unit-tests, sast, and integration-tests all run
          inside - whatever already has this app's toolchain installed, e.g. node:20,
          mcr.microsoft.com/dotnet/sdk:10.0, golang:1.23, python:3.12. This template never
          hardcodes a language; GitHub Actions injects Node.js into any container automatically,
          so the JS-based actions used inside these jobs (checkout, login, upload-artifact, the
          CodeQL actions) work regardless of the image's own base.
        required: true
        type: string
      install_command:
        description: "e.g. npm ci, or empty for a toolchain with no separate install step. Runs once, in the service's own working directory, before lint_command/test_command."
        required: false
        type: string
        default: ''
      lint_command:
        description: "e.g. 'npm run lint && npm run format:check', or 'dotnet format --verify-no-changes'. Runs in the service's own working directory."
        required: true
        type: string
      test_command:
        description: "e.g. npm run test:coverage, or a test-runner invocation with coverage flags."
        required: true
        type: string
      unit_test_working_directory:
        description: "Override if the test project is a sibling directory rather than the service's own (e.g. a separate test project directory). Defaults to working_directory."
        required: false
        type: string
        default: ''
      coverage_report_path:
        description: "Path (relative to repo root) to upload as the coverage-report artifact - a file or a directory, whatever the caller's own tooling produces."
        required: true
        type: string
      codeql_language:
        description: "CodeQL's own language identifier, e.g. javascript, csharp, go, python."
        required: true
        type: string
      codeql_paths_ignore:
        description: >-
          JSON array of FULL paths (already prefixed with working_directory) to exclude from
          CodeQL, e.g. '["services/my-service/node_modules"]'. JSON array syntax is valid YAML
          flow-sequence syntax, so this is spliced directly into CodeQL's own config: block - no
          fromJSON() needed.
        required: false
        type: string
        default: '[]'
      has_integration_tests:
        description: "Whether real integration-test code exists for this service yet."
        required: true
        type: boolean
      integration_test_command:
        description: "e.g. npm run test:integration, or a test-runner invocation targeting integration tests specifically. Only used when has_integration_tests is true."
        required: false
        type: string
        default: ''
      integration_test_working_directory:
        description: "Override if integration tests live in a separate project/directory from unit tests. Defaults to working_directory."
        required: false
        type: string
        default: ''
      integration_test_vars:
        description: >-
          JSON object of non-secret env vars the integration-tests job needs, e.g.
          '{"API_BASE_URL": "...", "TEST_DATABASE_NAME": "..."}'. Deliberately opaque to this
          template - it never needs to know what a caller's integration tests actually depend on;
          a caller with no such dependencies just omits this and gets an empty map. Any real
          credential belongs in its own named secrets: input instead, never in this blob.
        required: false
        type: string
        default: '{}'
    secrets:
      azure_client_id_ci:
        description: "Client ID of the identity used by integration-tests to authenticate to whatever real external systems it depends on. Only meaningful when has_integration_tests is true."
        required: false
      azure_tenant_id:
        description: >-
          Tenant ID for azure_client_id_ci's login. This template's only consumer - unlike the CD
          template, which shares the same-named secret across three separate logins, none of them
          conditional on the same flag as this one.
        required: false

permissions:
  contents: read

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < ${{ inputs.dockerfile_path }}

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Lint
        run: ${{ inputs.lint_command }}

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Run tests
        working-directory: ${{ inputs.unit_test_working_directory != '' && inputs.unit_test_working_directory || inputs.working_directory }}
        run: ${{ inputs.test_command }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.coverage_report_path }}
          retention-days: 14

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          format: table
          output: ${{ inputs.working_directory }}/trivy-fs-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-scan-results
          path: ${{ inputs.working_directory }}/trivy-fs-results.txt
          retention-days: 14

  sast:
    name: CodeQL (SAST)
    needs: [lint-and-format, unit-tests, dependency-scan, dockerfile-lint]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    container: ${{ inputs.build_container_image }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.37.7
        with:
          languages: ${{ inputs.codeql_language }}
          config: |
            paths:
              - ${{ inputs.working_directory }}
            paths-ignore: ${{ inputs.codeql_paths_ignore }}

      - uses: github/codeql-action/autobuild@v3.37.7

      - uses: github/codeql-action/analyze@v3.37.7

  integration-tests:
    name: Integration Tests
    needs: [lint-and-format, unit-tests, dependency-scan, dockerfile-lint, sast]
    # sast only runs on pull_request (see its own if:) - always skipped on a push to main, not
    # failed/succeeded. always() means every other needs entry now needs an explicit check too.
    if: |
      always() &&
      inputs.has_integration_tests &&
      needs.lint-and-format.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.dependency-scan.result == 'success' &&
      needs.dockerfile-lint.result == 'success' &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped') &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | bash

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id_ci }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          allow-no-subscriptions: true

      - name: Export AZURE_CLIENT_ID
        run: echo "AZURE_CLIENT_ID=${{ secrets.azure_client_id_ci }}" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: ${{ inputs.integration_test_working_directory != '' && inputs.integration_test_working_directory || inputs.working_directory }}
        # A piped exit code (`cmd | tee file`) only reflects tee's own success under the plain
        # POSIX `sh -e` this step runs under (containerized steps default to sh, not bash - no
        # pipefail available), so a real test failure was being silently swallowed by tee's own
        # exit 0. Redirecting to a file and capturing $? directly instead, immediately after the
        # command, works under any shell and can't be masked the same way.
        #
        # Retries up to twice, each bounded by the coreutils `timeout` command (confirmed
        # present in every current caller's build_container_image - all Debian-based) rather
        # than the whole job's 6-hour default.
        run: |
          set +e
          ATTEMPT_TIMEOUT_SECONDS=300
          MAX_ATTEMPTS=2
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Integration test attempt ${ATTEMPT}/${MAX_ATTEMPTS} (bounded to ${ATTEMPT_TIMEOUT_SECONDS}s) ==="
            timeout "$ATTEMPT_TIMEOUT_SECONDS" ${{ inputs.integration_test_command }} > test-results.txt 2>&1
            TEST_EXIT_CODE=$?
            cat test-results.txt
            if [ "$TEST_EXIT_CODE" -eq 0 ]; then
              break
            fi
            echo "::warning::Integration test attempt ${ATTEMPT} failed or timed out (exit code ${TEST_EXIT_CODE})"
            ATTEMPT=$((ATTEMPT + 1))
          done
          exit "$TEST_EXIT_CODE"
        env: ${{ fromJSON(inputs.integration_test_vars) }}

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ inputs.integration_test_working_directory != '' && inputs.integration_test_working_directory || inputs.working_directory }}/test-results.txt
          retention-days: 14
