name: service CI template

on:
  workflow_call:
    inputs:
      service_name:
        description: "A short identifier for this service, e.g. my-service. Used for image tags, artifact filenames, and naming conventions elsewhere in the pipeline - not used to derive a source path (see working_directory)."
        required: true
        type: string
      working_directory:
        description: >-
          Full path to this service's own source directory, e.g. services/my-service or
          apps/my-service, or "." for a single-service repository. This template makes no
          assumption about repository layout - whatever path you supply is used as-is.
        required: true
        type: string
      has_image_push:
        description: >-
          Whether to run push-image (authenticate to a container registry and push the built,
          scanned image) after build-image/container-scan/image-compliance-scan. A caller that
          only wants CI checks - lint, tests, scans, a local build - and no registry/deploy
          relationship at all should skip this entirely (false) and needs zero Azure identity or
          secret to adopt this template. When false, has_gitops_deploy's own jobs are
          automatically skipped too, the same way has_gitops_deploy:false already skips
          smoke-test-staging/rollback-staging - there's no image in the registry for them to
          deploy.
        required: false
        type: boolean
        default: true
      has_gitops_deploy:
        description: >-
          Whether to run update-staging-values.yaml (writing the new image tag to your GitOps
          repository via a Helm values file edit + git push) after the image is built and pushed.
          This is a skip toggle, not an escape hatch to a different deploy mechanism - a caller
          not using Helm/GitOps should skip this entirely (false) and bring its own deploy job.
          When false, smoke-test-staging and rollback-staging are automatically skipped too
          (they depend on update-staging-values / smoke-test-staging, and GitHub's own gating on
          needs: does the rest for free). Only meaningful when has_image_push is also true.
        required: false
        type: boolean
        default: true
      gitops_repository:
        description: "Your GitOps repository, as owner/repo, e.g. my-org/my-gitops-repo. Only meaningful when has_gitops_deploy is true."
        required: false
        type: string
        default: ''
      chart_path:
        description: "Chart directory in your GitOps repository, e.g. charts/my-service (values-staging.yaml is appended). Only meaningful when has_gitops_deploy is true."
        required: false
        type: string
        default: ''
      image_repository:
        description: "Full container registry repository path for this service's image, e.g. myregistry.azurecr.io/my-service."
        required: true
        type: string
      container_registry_name:
        description: "Just the registry name push-image logs into, e.g. myregistry (the part of image_repository before .azurecr.io). Kept as its own input rather than parsed out of image_repository, since GitHub Actions expressions have no string-split function. Only meaningful when has_image_push is true."
        required: false
        type: string
        default: ''
      dockerfile_path:
        description: "Full path to this service's own Dockerfile, e.g. services/my-service/Dockerfile."
        required: true
        type: string
      build_container_image:
        description: >-
          The container image lint-and-format, unit-tests, sast, and integration-tests all run
          inside - whatever already has this app's toolchain installed, e.g. node:20,
          mcr.microsoft.com/dotnet/sdk:10.0, golang:1.23, python:3.12. This template never
          hardcodes a language; GitHub Actions injects Node.js into any container automatically,
          so the JS-based actions used inside these jobs (checkout, login, upload-artifact, the
          CodeQL actions) work regardless of the image's own base.
        required: true
        type: string
      install_command:
        description: "e.g. npm ci, or empty for a toolchain with no separate install step. Runs once, in the service's own working directory, before lint_command/test_command."
        required: false
        type: string
        default: ''
      lint_command:
        description: "e.g. 'npm run lint && npm run format:check', or 'dotnet format --verify-no-changes'. Runs in the service's own working directory."
        required: true
        type: string
      test_command:
        description: "e.g. npm run test:coverage, or a test-runner invocation with coverage flags."
        required: true
        type: string
      unit_test_working_directory:
        description: "Override if the test project is a sibling directory rather than the service's own (e.g. a separate test project directory). Defaults to working_directory."
        required: false
        type: string
        default: ''
      coverage_report_path:
        description: "Path (relative to repo root) to upload as the coverage-report artifact - a file or a directory, whatever the caller's own tooling produces."
        required: true
        type: string
      codeql_language:
        description: "CodeQL's own language identifier, e.g. javascript, csharp, go, python."
        required: true
        type: string
      codeql_paths_ignore:
        description: >-
          JSON array of FULL paths (already prefixed with working_directory) to exclude from
          CodeQL, e.g. '["services/my-service/node_modules"]'. JSON array syntax is valid YAML
          flow-sequence syntax, so this is spliced directly into CodeQL's own config: block - no
          fromJSON() needed.
        required: false
        type: string
        default: '[]'
      has_integration_tests:
        description: "Whether real integration-test code exists for this service yet."
        required: true
        type: boolean
      integration_test_command:
        description: "e.g. npm run test:integration, or a test-runner invocation targeting integration tests specifically. Only used when has_integration_tests is true."
        required: false
        type: string
        default: ''
      integration_test_working_directory:
        description: "Override if integration tests live in a separate project/directory from unit tests. Defaults to working_directory."
        required: false
        type: string
        default: ''
      integration_test_vars:
        description: >-
          JSON object of non-secret env vars the integration-tests job needs, e.g.
          '{"API_BASE_URL": "...", "TEST_DATABASE_NAME": "..."}'. Deliberately opaque to this
          template - it never needs to know what a caller's integration tests actually depend on;
          a caller with no such dependencies just omits this and gets an empty map. Any real
          credential belongs in its own named secrets: input instead, never in this blob.
        required: false
        type: string
        default: '{}'
      has_smoke_test:
        description: >-
          Whether to run smoke-test-staging (and its rollback-staging safety net) after deploy.
          Unlike the inputs above, this is deliberately NOT an escape hatch to a different
          verification mechanism - smoke-test-staging assumes a specific Kubernetes + GitOps
          deployment target (that specificity is the actual value of the job, not incidental
          scaffolding around it). A caller with a different deployment target should skip it
          entirely (false) and bring its own deploy + verify job.
        required: false
        type: boolean
        default: true
      aks_resource_group:
        description: "Resource group of the AKS cluster smoke-test-staging verifies against. Only meaningful when has_smoke_test is true."
        required: false
        type: string
        default: ''
      aks_cluster_name:
        description: "Name of the AKS cluster smoke-test-staging verifies against. Only meaningful when has_smoke_test is true."
        required: false
        type: string
        default: ''
      staging_namespace:
        description: "Kubernetes namespace the staging deployment lives in. Only meaningful when has_smoke_test is true."
        required: false
        type: string
        default: ''
      smoke_test_script_path:
        description: >-
          Path, in your own repository, to the script that runs the smoke test described above.
          Only meaningful when has_smoke_test is true.
        required: false
        type: string
        default: 'scripts/smoke-test.sh'
      rollback_script_path:
        description: >-
          Path, in your own repository, to the script rollback-staging runs to find the last
          known-good tag to roll back to.
        required: false
        type: string
        default: 'scripts/find-rollback-target.sh'
    secrets:
      azure_client_id_ci:
        description: "Client ID of the identity used by integration-tests to authenticate to whatever real external systems it depends on."
        required: false
      azure_client_id_cd:
        description: "Client ID of the identity used by push-image to authenticate to the container registry. Only meaningful when has_image_push is true - a CI-only caller needs none of this."
        required: false
      azure_client_id_smoke:
        description: "Client ID of the identity used by smoke-test-staging to authenticate to the Kubernetes cluster and verify the deployment."
        required: false
      gitops_pat:
        description: "Token with write access to the GitOps repository, used to commit the new image tag (and, on rollback, a prior one)."
        required: false
      azure_tenant_id:
        description: "Tenant ID shared by all three identities above. Only meaningful when at least one of has_image_push/has_smoke_test is true."
        required: false
      azure_subscription_id:
        description: "Subscription ID shared by all three identities above. Same reasoning as azure_tenant_id."
        required: false

# Restrictive default; sast overrides to add security-events: write, same as both original files.
permissions:
  contents: read

jobs:
  dockerfile-lint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 < ${{ inputs.dockerfile_path }}

  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        run: ${{ inputs.install_command }}

      - name: Lint
        run: ${{ inputs.lint_command }}

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Run tests
        working-directory: ${{ inputs.unit_test_working_directory != '' && inputs.unit_test_working_directory || inputs.working_directory }}
        run: ${{ inputs.test_command }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ inputs.coverage_report_path }}
          retention-days: 14

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          format: table
          output: ${{ inputs.working_directory }}/trivy-fs-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-scan-results
          path: ${{ inputs.working_directory }}/trivy-fs-results.txt
          retention-days: 14

  sast:
    name: CodeQL (SAST)
    needs: [lint-and-format, unit-tests, dependency-scan, dockerfile-lint]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    container: ${{ inputs.build_container_image }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.37.7
        with:
          languages: ${{ inputs.codeql_language }}
          config: |
            paths:
              - ${{ inputs.working_directory }}
            paths-ignore: ${{ inputs.codeql_paths_ignore }}

      - uses: github/codeql-action/autobuild@v3.37.7

      - uses: github/codeql-action/analyze@v3.37.7

  build-image:
    name: Docker Build
    needs: [lint-and-format, unit-tests, dependency-scan, dockerfile-lint, integration-tests]
    # integration-tests is ALWAYS a needs: dependency (workflow_call's static job graph means it
    # always exists), but for a caller with has_integration_tests: false it's skipped, not
    # failed/succeeded - same reasoning as push-image's own needs.integration-tests handling
    # below. always() means every OTHER needs entry now requires an explicit check too, not just
    # this one - there's no shortcut once always() is present.
    if: |
      always() &&
      needs.lint-and-format.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.dependency-scan.result == 'success' &&
      needs.dockerfile-lint.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --platform linux/amd64 -t ${{ inputs.image_repository }}:${{ steps.vars.outputs.image_tag }} .

      - name: Save image
        run: docker save ${{ inputs.image_repository }}:${{ steps.vars.outputs.image_tag }} -o ${{ inputs.service_name }}-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ inputs.working_directory }}/${{ inputs.service_name }}-image.tar
          retention-days: 3

  integration-tests:
    name: Integration Tests
    needs: [lint-and-format, unit-tests, dependency-scan, dockerfile-lint, sast]
    # sast only runs on pull_request (see its own if:) - always skipped on a push to main, not
    # failed/succeeded. always() means every other needs entry now needs an explicit check too,
    # same reasoning as build-image's own needs.integration-tests handling above.
    if: |
      always() &&
      inputs.has_integration_tests &&
      needs.lint-and-format.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.dependency-scan.result == 'success' &&
      needs.dockerfile-lint.result == 'success' &&
      (needs.sast.result == 'success' || needs.sast.result == 'skipped') &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    container: ${{ inputs.build_container_image }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: inputs.install_command != ''
        working-directory: ${{ inputs.working_directory }}
        run: ${{ inputs.install_command }}

      - name: Install Azure CLI
        run: curl -sL https://aka.ms/InstallAzureCLIDeb | bash

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id_ci }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          allow-no-subscriptions: true

      - name: Export AZURE_CLIENT_ID
        run: echo "AZURE_CLIENT_ID=${{ secrets.azure_client_id_ci }}" >> "$GITHUB_ENV"

      - name: Run integration tests
        working-directory: ${{ inputs.integration_test_working_directory != '' && inputs.integration_test_working_directory || inputs.working_directory }}
        # A piped exit code (`cmd | tee file`) only reflects tee's own success under the plain
        # POSIX `sh -e` this step runs under (containerized steps default to sh, not bash - no
        # pipefail available), so a real test failure was being silently swallowed by tee's own
        # exit 0. Redirecting to a file and capturing $? directly instead, immediately after the
        # command, works under any shell and can't be masked the same way - confirmed for real:
        # this exact step reported success on a run where 1 of 3 integration tests genuinely
        # failed.
        #
        # Retries up to twice, each bounded by the coreutils `timeout` command (confirmed
        # present in every current caller's build_container_image - all Debian-based) rather
        # than the whole job's 6-hour default - confirmed for real that this step can otherwise
        # hang completely silently (a real Cosmos-side contention/connectivity issue, most
        # likely from all three services' integration tests now running more tightly clustered
        # under the sast -> integration-tests sequencing) with zero output until killed. A
        # second attempt costs a few minutes against a real, transient failure; a genuine,
        # reproducible test failure still fails after exhausting both attempts.
        run: |
          set +e
          ATTEMPT_TIMEOUT_SECONDS=300
          MAX_ATTEMPTS=2
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Integration test attempt ${ATTEMPT}/${MAX_ATTEMPTS} (bounded to ${ATTEMPT_TIMEOUT_SECONDS}s) ==="
            timeout "$ATTEMPT_TIMEOUT_SECONDS" ${{ inputs.integration_test_command }} > test-results.txt 2>&1
            TEST_EXIT_CODE=$?
            cat test-results.txt
            if [ "$TEST_EXIT_CODE" -eq 0 ]; then
              break
            fi
            echo "::warning::Integration test attempt ${ATTEMPT} failed or timed out (exit code ${TEST_EXIT_CODE})"
            ATTEMPT=$((ATTEMPT + 1))
          done
          exit "$TEST_EXIT_CODE"
        env: ${{ fromJSON(inputs.integration_test_vars) }}

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ inputs.integration_test_working_directory != '' && inputs.integration_test_working_directory || inputs.working_directory }}/test-results.txt
          retention-days: 14

  container-scan:
    name: Container Vulnerability Scan
    needs: build-image
    if: |
      always() &&
      needs.build-image.result == 'success' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.build-image.outputs.image_tag }}
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ inputs.working_directory }}

      - run: docker load -i ${{ inputs.service_name }}-image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ inputs.image_repository }}:${{ needs.build-image.outputs.image_tag }}
          format: table
          output: ${{ inputs.working_directory }}/trivy-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: ${{ inputs.working_directory }}/trivy-results.txt
          retention-days: 14

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ inputs.image_repository }}:${{ needs.build-image.outputs.image_tag }}
          format: cyclonedx
          output: ${{ inputs.working_directory }}/sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ${{ inputs.working_directory }}/sbom.cyclonedx.json
          retention-days: 90

  image-compliance-scan:
    name: Image Compliance Scan (CIS Docker Benchmark)
    needs: build-image
    if: |
      always() &&
      needs.build-image.result == 'success' &&
      (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ inputs.working_directory }}

      - run: docker load -i ${{ inputs.service_name }}-image.tar

      - name: Run dockle
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:v0.4.15 \
            --exit-code 1 --exit-level warn \
            ${{ inputs.image_repository }}:${{ needs.build-image.outputs.image_tag }}

  push-image:
    name: Push Image to ACR (staging)
    needs: [container-scan, image-compliance-scan, integration-tests]
    if: |
      always() &&
      inputs.has_image_push &&
      needs.container-scan.result == 'success' &&
      needs.image-compliance-scan.result == 'success' &&
      (needs.integration-tests.result == 'success' || needs.integration-tests.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.container-scan.outputs.image_tag }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ inputs.working_directory }}

      - run: docker load -i ${{ inputs.service_name }}-image.tar

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id_cd }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: Login to ACR
        run: az acr login --name ${{ inputs.container_registry_name }}

      - name: Push image
        run: docker push ${{ inputs.image_repository }}:${{ needs.container-scan.outputs.image_tag }}

  update-staging-values:
    name: Update staging image tag (GitOps)
    needs: push-image
    if: |
      always() &&
      needs.push-image.result == 'success' &&
      inputs.has_gitops_deploy &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.push-image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repository }}
          token: ${{ secrets.gitops_pat }}

      - name: Install yq
        run: |
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set staging image tag
        run: yq -i '.image.tag = "${{ needs.push-image.outputs.image_tag }}"' ${{ inputs.chart_path }}/values-staging.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.chart_path }}/values-staging.yaml
          # Confirmed for real (in service-promotion-template.yml's equivalent step): re-running
          # against an already-current tag leaves nothing staged - git commit fails outright on
          # "nothing to commit" rather than treating an already-correct state as a no-op success.
          if git diff --staged --quiet; then
            echo "${{ inputs.chart_path }}/values-staging.yaml already references ${{ needs.push-image.outputs.image_tag }} - nothing to commit."
          else
            git commit -m "deploy(staging): ${{ inputs.service_name }} to ${{ needs.push-image.outputs.image_tag }}

          Source: ${{ github.repository }}@${{ github.sha }}"
            git push
          fi

  smoke-test-staging:
    name: Smoke Test (staging)
    needs: update-staging-values
    if: |
      always() &&
      needs.update-staging-values.result == 'success' &&
      inputs.has_smoke_test &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ needs.update-staging-values.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.azure_client_id_smoke }}
          tenant-id: ${{ secrets.azure_tenant_id }}
          subscription-id: ${{ secrets.azure_subscription_id }}

      - name: Install kubectl + kubelogin
        run: sudo az aks install-cli

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group ${{ inputs.aks_resource_group }} --name ${{ inputs.aks_cluster_name }} --overwrite-existing

      - name: Convert kubeconfig for azurecli auth
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Run staging smoke test
        id: smoke_test
        env:
          EXPECTED_TAG: ${{ needs.update-staging-values.outputs.image_tag }}
          NAMESPACE: ${{ inputs.staging_namespace }}
          ARGOCD_APP_NAME: ${{ inputs.service_name }}-staging
          SERVICE_NAME: ${{ inputs.service_name }}
          AZURE_CLIENT_ID: ${{ secrets.azure_client_id_smoke }}
        run: ${{ inputs.smoke_test_script_path }}

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-evidence-staging
          path: smoke-test-evidence/
          retention-days: 14

  rollback-staging:
    name: Rollback staging (automatic)
    needs: smoke-test-staging
    if: failure() && needs.smoke-test-staging.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Find rollback target
        id: find_target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: ${{ inputs.service_name }}-ci.yml
          SMOKE_TEST_JOB_NAME: "call-service-ci / Smoke Test (staging)"
          TAG_SOURCE: head_sha
          LOOKBACK_LIMIT: "10"
        run: ${{ inputs.rollback_script_path }}

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gitops_repository }}
          token: ${{ secrets.gitops_pat }}
          path: gitops-repo

      - name: Install yq
        run: |
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set staging image tag to rollback target
        working-directory: gitops-repo
        run: yq -i '.image.tag = "${{ steps.find_target.outputs.rollback_tag }}"' ${{ inputs.chart_path }}/values-staging.yaml

      - name: Commit and push rollback
        working-directory: gitops-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ inputs.chart_path }}/values-staging.yaml
          # Same guard as the staging deploy commit step above - see that step's comment.
          if git diff --staged --quiet; then
            echo "${{ inputs.chart_path }}/values-staging.yaml already references ${{ steps.find_target.outputs.rollback_tag }} - nothing to commit."
          else
            git commit -m "rollback(staging): automatic rollback to ${{ steps.find_target.outputs.rollback_tag }}

          AUTOMATIC ROLLBACK - triggered by a failed staging smoke test
          Rolled back FROM: ${{ needs.smoke-test-staging.outputs.image_tag }}
          Rolled back TO (last verified-good): ${{ steps.find_target.outputs.rollback_tag }}
          Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            git push
          fi

      - name: Report rollback
        run: |
          {
            echo "## Automatic staging rollback"
            echo ""
            echo "Smoke test failed for tag \`${{ needs.smoke-test-staging.outputs.image_tag }}\`."
            echo ""
            echo "Rolled staging back to tag \`${{ steps.find_target.outputs.rollback_tag }}\` - the most recent tag with a genuinely verified staging smoke test (from run [${{ steps.find_target.outputs.rollback_run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find_target.outputs.rollback_run_id }})). Pushed to the GitOps repository."
            echo ""
            echo "ArgoCD will sync this automatically, same as any other change - no manual action needed."
          } >> "$GITHUB_STEP_SUMMARY"
