name: incidents-service production promotion
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: >-
          Short SHA image tag to promote (must already be built, scanned, and smoke-tested in
          staging)
        required: true
        type: string

# See events-service-production-promotion.yml for why this exists.
permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  call-service-promotion:
    uses: ./.github/workflows/service-promotion-template.yml
    with:
      service_name: incidents-service
      gitops_repository: teejayade2244/inframonitor-gitops
      chart_path: charts/incidents-service
      image_tag: ${{ inputs.image_tag }}
      aks_resource_group: inframonitor-aks-rg
      aks_cluster_name: inframonitor-aks
      production_namespace: inframonitor-production
      smoke_test_script_path: scripts/smoke-test.sh
    secrets:
      azure_client_id_smoke: ${{ secrets.AZURE_CLIENT_ID_INCIDENTS_SMOKE }}
      gitops_pat: ${{ secrets.GITOPS_PAT }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
