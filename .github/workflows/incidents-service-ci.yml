name: incidents-service CI

on:
  push:
    branches: ['**']
    paths:
      - 'Microservices/services/incidents-service/**'
      - 'Microservices/services/incidents-service.Tests/**'
  pull_request:
    branches: [main]
    paths:
      - 'Microservices/services/incidents-service/**'
      - 'Microservices/services/incidents-service.Tests/**'

  workflow_dispatch: {}

# Restrictive default; the sast job overrides this to add security-events: write, which the
# CodeQL analyze step needs regardless of the repo's default token permissions.
permissions:
  contents: read

env:
  WORKING_DIR: Microservices/services/incidents-service
  TEST_DIR: Microservices/services/incidents-service.Tests
  DOTNET_VERSION: '10.0.x'

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet format --verify-no-changes

  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    # No job-level working-directory default here (unlike lint-and-format) - the test project
    # lives in TEST_DIR, a sibling of WORKING_DIR, not inside it.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run tests with coverage
        working-directory: ${{ env.TEST_DIR }}
        run: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=70 /p:ThresholdType=line /p:ThresholdStat=total

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.TEST_DIR }}/coverage.cobertura.xml
          retention-days: 14

  dependency-scan:
    name: Dependency Scan (packages.lock.json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Filesystem-mode scan of packages.lock.json directly, before any build happens - mirrors
      # events-service's package-lock.json scan, but NOT a like-for-like assumption: Trivy's
      # NuGet support needs packages.lock.json, packages.config, or *Packages.props to find
      # anything at all - it does not parse a bare .csproj (confirmed against Trivy's own docs,
      # and against the previous absence of any lock file here). packages.lock.json is generated
      # via <RestorePackagesWithLockFile>true</RestorePackagesWithLockFile> in
      # incidents-service.csproj and committed, specifically so this job has a real target.
      - name: Run Trivy dependency scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ env.WORKING_DIR }}
          format: table
          output: ${{ env.WORKING_DIR }}/trivy-fs-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-dependency-scan-results
          path: ${{ env.WORKING_DIR }}/trivy-fs-results.txt
          retention-days: 14

  sast:
    name: CodeQL (SAST)
    needs: [lint-and-format, unit-tests]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: github/codeql-action/init@v3.37.7
        with:
          languages: csharp
          config: |
            paths:
              - ${{ env.WORKING_DIR }}
            paths-ignore:
              - ${{ env.WORKING_DIR }}/bin
              - ${{ env.WORKING_DIR }}/obj

      - uses: github/codeql-action/autobuild@v3.37.7

      - uses: github/codeql-action/analyze@v3.37.7

  build-image:
    name: Docker Build
    needs: [lint-and-format, unit-tests]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build --platform linux/amd64 -t inframonitoraksacr.azurecr.io/incidents-service:${{ steps.vars.outputs.image_tag }} .

      - name: Save image
        run: docker save inframonitoraksacr.azurecr.io/incidents-service:${{ steps.vars.outputs.image_tag }} -o incidents-service-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.WORKING_DIR }}/incidents-service-image.tar
          retention-days: 3

  # integration-tests: DEFERRED, deliberately omitted from this pipeline for now - not stubbed,
  # not silently skipped, just not here yet. Prerequisite: real .NET integration test code
  # against InfraMonitorTestDB's Incidents container via incidents-service-ci-identity (OIDC),
  # mirroring events-service's __tests__/integration/events.integration.test.js pattern (real
  # Cosmos client independently constructed from the app's own, real writes/reads against real
  # test infrastructure, marker-based cleanup). That container and the CI identity's Cosmos RBAC
  # both already exist and were verified real before this workflow was written - the test CODE
  # itself is what's missing. push-image below needs: container-scan only (not
  # [container-scan, integration-tests] the way events-service's does) to reflect this honestly.

  container-scan:
    name: Container Vulnerability Scan
    needs: build-image
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.build-image.outputs.image_tag }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ env.WORKING_DIR }}

      - run: docker load -i incidents-service-image.tar

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: inframonitoraksacr.azurecr.io/incidents-service:${{ needs.build-image.outputs.image_tag }}
          format: table
          output: ${{ env.WORKING_DIR }}/trivy-results.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-results
          path: ${{ env.WORKING_DIR }}/trivy-results.txt
          retention-days: 14

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: inframonitoraksacr.azurecr.io/incidents-service:${{ needs.build-image.outputs.image_tag }}
          format: cyclonedx
          output: ${{ env.WORKING_DIR }}/sbom.cyclonedx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: ${{ env.WORKING_DIR }}/sbom.cyclonedx.json
          retention-days: 90

  push-image:
    name: Push Image to ACR (staging)
    # container-scan only - see the integration-tests placeholder comment above for why this
    # deliberately differs from events-service's [container-scan, integration-tests].
    needs: container-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.container-scan.outputs.image_tag }}
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      # Second (and, since integration-tests isn't in this pipeline yet, final) reuse of the
      # single image build-image produced - still not a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ${{ env.WORKING_DIR }}

      - run: docker load -i incidents-service-image.tar

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_INCIDENTS_CD }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name inframonitoraksacr

      - name: Push image
        run: docker push inframonitoraksacr.azurecr.io/incidents-service:${{ needs.container-scan.outputs.image_tag }}

  update-staging-values:
    name: Update staging image tag (inframonitor-gitops)
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ needs.push-image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: teejayade2244/inframonitor-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Install yq
        run: |
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
      - name: Set staging image tag
        run: yq -i '.image.tag = "${{ needs.push-image.outputs.image_tag }}"' charts/incidents-service/values-staging.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/incidents-service/values-staging.yaml
          git commit -m "deploy(staging): incidents-service to ${{ needs.push-image.outputs.image_tag }}

          Source: teejayade2244/Cloud-Infrastructure-Monitoring-Alerting-Platform@${{ github.sha }}"
          git push

  smoke-test-staging:
    name: Smoke Test (staging)
    needs: update-staging-values
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ needs.update-staging-values.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_INCIDENTS_SMOKE }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubectl + kubelogin
        run: sudo az aks install-cli

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group inframonitor-aks-rg --name inframonitor-aks --overwrite-existing

      - name: Convert kubeconfig for azurecli auth
        run: kubelogin convert-kubeconfig -l azurecli

      - name: Run staging smoke test
        id: smoke_test
        env:
          EXPECTED_TAG: ${{ needs.update-staging-values.outputs.image_tag }}
          NAMESPACE: inframonitor
          # SERVICE_NAME both selects the K8s Deployment/pod label to poll for AND which
          # write/cleanup logic scripts/smoke-test.sh runs (see verify_write_incidents there) -
          # incidents-service has no delete endpoint, so cleanup PATCHes the synthetic incident
          # to a terminal status instead of removing it (confirmed against the real controller).
          SERVICE_NAME: incidents-service
          ARGOCD_APP_NAME: incidents-service-staging
        run: scripts/smoke-test.sh

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-evidence-staging
          path: smoke-test-evidence/
          retention-days: 14

  rollback-staging:
    name: Rollback staging (automatic)
    needs: smoke-test-staging
    # failure() required, not just the needs.*.result check alone - GitHub Actions silently ANDs
    # an implicit success() onto a job's if: condition unless it already contains a status-check
    # function, confirmed the hard way for events-service's equivalent job.
    if: failure() && needs.smoke-test-staging.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Find rollback target
        id: find_target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: incidents-service-ci.yml
          SMOKE_TEST_JOB_NAME: "Smoke Test (staging)"
          TAG_SOURCE: head_sha
          LOOKBACK_LIMIT: "10"
        run: scripts/find-rollback-target.sh

      - name: Checkout inframonitor-gitops
        uses: actions/checkout@v4
        with:
          repository: teejayade2244/inframonitor-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: inframonitor-gitops

      - name: Install yq
        run: |
          curl -sL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq

      - name: Set staging image tag to rollback target
        working-directory: inframonitor-gitops
        run: yq -i '.image.tag = "${{ steps.find_target.outputs.rollback_tag }}"' charts/incidents-service/values-staging.yaml

      - name: Commit and push rollback
        working-directory: inframonitor-gitops
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/incidents-service/values-staging.yaml
          git commit -m "rollback(staging): automatic rollback to ${{ steps.find_target.outputs.rollback_tag }}

          AUTOMATIC ROLLBACK - triggered by a failed staging smoke test
          Rolled back FROM: ${{ needs.smoke-test-staging.outputs.image_tag }}
          Rolled back TO (last verified-good): ${{ steps.find_target.outputs.rollback_tag }}
          Failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git push

      - name: Report rollback
        run: |
          {
            echo "## Automatic staging rollback"
            echo ""
            echo "Smoke test failed for tag \`${{ needs.smoke-test-staging.outputs.image_tag }}\`."
            echo ""
            echo "Rolled staging back to tag \`${{ steps.find_target.outputs.rollback_tag }}\` - the most recent tag with a genuinely verified staging smoke test (from run [${{ steps.find_target.outputs.rollback_run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find_target.outputs.rollback_run_id }})). Pushed to inframonitor-gitops."
            echo ""
            echo "ArgoCD will sync this automatically, same as any other change - no manual action needed."
          } >> "$GITHUB_STEP_SUMMARY"
