name: incidents-service CI

on:
  push:
    branches: ['**']
    paths:
      - 'Microservices/services/incidents-service/**'
      - 'Microservices/services/incidents-service.Tests/**'
      - 'Microservices/services/incidents-service.IntegrationTests/**'
  pull_request:
    branches: [main]
    paths:
      - 'Microservices/services/incidents-service/**'
      - 'Microservices/services/incidents-service.Tests/**'
      - 'Microservices/services/incidents-service.IntegrationTests/**'

  workflow_dispatch: {}

# See events-service-ci.yml for why this exists - a job inside a called workflow_call template
# can only request permissions up to what this calling workflow grants at its own top level.
permissions:
  contents: read
  security-events: write
  id-token: write
  actions: read

jobs:
  call-service-ci:
    uses: ./.github/workflows/service-ci-template.yml
    with:
      service_name: incidents-service
      chart_path: charts/incidents-service
      image_repository: inframonitoraksacr.azurecr.io/incidents-service
      build_container_image: mcr.microsoft.com/dotnet/sdk:10.0
      lint_command: dotnet format --verify-no-changes
      test_command: dotnet test /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=70 /p:ThresholdType=line /p:ThresholdStat=total
      unit_test_working_directory: Microservices/services/incidents-service.Tests
      coverage_report_path: Microservices/services/incidents-service.Tests/coverage.cobertura.xml
      codeql_language: csharp
      codeql_paths_ignore: '["Microservices/services/incidents-service/bin", "Microservices/services/incidents-service/obj"]'
      # Real integration test code now exists - incidents-service.IntegrationTests, against
      # InfraMonitorTestDB's Incidents container. No Service Bus dependency at all (unlike
      # events-service), so this blob is deliberately narrower than events-service-ci.yml's.
      has_integration_tests: true
      integration_test_command: dotnet test
      integration_test_working_directory: Microservices/services/incidents-service.IntegrationTests
      integration_test_vars: |
        {
          "COSMOS_ENDPOINT": "${{ vars.COSMOS_ENDPOINT }}",
          "COSMOS_TEST_DATABASE": "${{ vars.COSMOS_TEST_DATABASE }}"
        }
      has_smoke_test: true
    secrets:
      azure_client_id_ci: ${{ secrets.AZURE_CLIENT_ID_INCIDENTS_CI }}
      azure_client_id_cd: ${{ secrets.AZURE_CLIENT_ID_INCIDENTS_CD }}
      azure_client_id_smoke: ${{ secrets.AZURE_CLIENT_ID_INCIDENTS_SMOKE }}
      gitops_pat: ${{ secrets.GITOPS_PAT }}
      azure_tenant_id: ${{ secrets.AZURE_TENANT_ID }}
      azure_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
