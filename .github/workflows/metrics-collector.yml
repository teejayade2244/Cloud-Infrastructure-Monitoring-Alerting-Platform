name: Metrics Collector

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    name: Collect DORA + pipeline-timing metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install collector dependencies
        working-directory: scripts/metrics-collector
        run: npm ci

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_METRICS_COLLECTOR }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Export AZURE_CLIENT_ID
        run: echo "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID_METRICS_COLLECTOR }}" >> "$GITHUB_ENV"

      - name: Run collector
        working-directory: scripts/metrics-collector
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSMOS_ENDPOINT: "https://inframonitor-aks-cosmos.documents.azure.com:443/"
        run: node index.js
